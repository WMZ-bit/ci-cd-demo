name: CI

# 触发条件：推送到 main、针对 main 的 PR，以及手动点「Run workflow」
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限原则：默认只读代码，不写任何东西
permissions:
  contents: read

# 同一个分支上重复推送时，自动取消尚未跑完的旧任务，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 某个版本挂了也让其他版本跑完，一次看全
      matrix:
        node-version: [20, 22]
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm # 依据 package-lock.json 缓存依赖

      - name: 安装依赖
        run: npm ci # 严格按 lockfile 安装，比 npm install 更适合 CI

      - name: 运行测试
        run: npm test

  build:
    name: 构建产物
    runs-on: ubuntu-latest
    needs: test # 测试不过就不构建
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 冒烟检查
        run: test -f dist/index.html # 确保产物真的生成了

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
